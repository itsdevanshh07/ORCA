server:
  port: ${PORT:8080} 

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false 

  ai:
    model:
      chat: ${ORCA_GEMINI_PROVIDER:none}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${SPRING_AI_MODEL_CHAT:gemini-3.8-flash}
            response-mime-type: application/json
            temperature: 0.1

orca:
  healing:
    timeout: ${ORCA_HEALING_TIMEOUT:PT25S}

resilience4j:
  circuitbreaker:
    instances:
      targetApi: 
        slidingWindowSize: 5 
        failureRateThreshold: 50 
        waitDurationInOpenState: 15s 
        permittedNumberOfCallsInHalfOpenState: 2 
        minimumNumberOfCalls: 3

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
